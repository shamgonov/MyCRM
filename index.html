<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CRM2 — операционная CRM сервисной компании (ремонт окон): заявки, календарь, закупки, отчёты.">
  <meta name="theme-color" content="#0a0a0a">
  <title>CRM2 — Сервис окон</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles/theme.css">
</head>
<body>
  <div id="app"></div>
  <nav id="nav"></nav>
  <div id="modal-container"></div>
  <div id="toast"></div>
  <noscript>Для работы CRM2 включите JavaScript.</noscript>

  <!-- Только внешние модули, инлайн-скрипты запрещены (SPEC, правило 1) -->
  <!-- Firebase SDK (Compat версия для работы без сборщика) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  
  <!-- Наша конфигурация Firebase -->
  <script src="app/firebase-config.js"></script>
  
  <!-- db.js первым: core.js вызывает localToday()/утилиты db сразу при загрузке -->
  <script src="app/db.js"></script>
  
  <script src="app/core.js"></script>
  <script src="app/auth.js"></script>
  
  <!-- Этап 21: синхронизация с Firestore — после firebase-config/auth, до ui-модулей -->
  <script src="app/sync.js"></script>
  
  <script src="app/gates.js"></script>
  <script src="app/orders.js"></script>
  <!-- app/notify.js — появится на следующем этапе -->
  <!-- <script src="app/notify.js"></script> -->
  <script src="app/ui-orders.js"></script>
  <!-- ui-attention.js ПОСЛЕ ui-orders.js: использует statusBadgeClass/STATUS_LABELS,
       а ui-orders.js вызывает renderCallResultModal лениво (typeof) при клике. -->
  <script src="app/ui-attention.js"></script>
  <script src="app/ui-calendar.js"></script>
  <script src="app/ui-estimate.js"></script>
  <script src="app/ui-shopping.js"></script>
  <script src="app/ui-docs.js"></script>
  <script src="app/ui-money.js"></script>
  <script src="app/ui-clients.js"></script>
  <script src="app/notify.js"></script>
  <script src="app/ui-reports.js"></script>
  <script src="app/ui-admin.js"></script>
  <!-- Органайзер, калькулятор, профиль (Этап 20) -->
  <script src="app/ui-tasks.js"></script>
  <script src="app/ui-calc.js"></script>
  <script src="app/ui-profile.js"></script>
  <!-- Индикатор статуса синхронизации (Этап 25) -->
  <script src="app/ui-sync.js"></script>
</body>
</html>
